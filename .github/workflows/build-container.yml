name: Build and Push Container

on:
  push:
    paths:
      - fragcna.dockerfile
      - .github/workflows/build-container.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/${{ github.actor }}/fragcna:latest -f fragcna.dockerfile .

      - name: Push image
        run: docker push ghcr.io/${{ github.actor }}/fragcna:latest
